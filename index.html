<style>

:root{

:root.winter{--paper:#dcdfdb;--paper-2:#cfd4d1;--paper-3:#bac3c0;--ink:#1c242a;--ink-2:#45525a;--rule:#6a7982;--accent:#2c5f84;--accent-ink:#f4faff;--warn-bg:#d9e0e4;--shade:rgba(28,36,42,.10);--halo:#dcdfdb}

@media (max-height:520px){.hud{padding:2px 6px;gap:2px}.brand,.month-bar{display:none}.clock{min-width:0}.date{font-size:12px}.chip{font-size:10px;line-height:1.4}.speed button{min-width:28px;padding:1px 4px;font-size:11px}.res{padding:0 5px}.res .k{font-size:9px}.res .v{font-size:12px}.res .d{font-size:9px}.menubar{gap:3px}.menubar button,.menubar .side-tabs button{font-size:11px;padding:2px 6px}.bcol2{max-height:calc(100vh - var(--barh) - 30px)}.bcat{padding:3px 4px;font-size:12px}.buildbar button{font-size:11px;padding:2px 6px}.buildbar button small{font-size:9px}.side{top:34px}}

.bgrp.bside{margin-left:auto;border-left:2px solid var(--ink)}
.bgl{font-size:10px;letter-spacing:.1em;color:var(--ink-2);line-height:1.2}
.bgb{display:flex;gap:3px;flex-wrap:wrap}
.bcol1{display:grid;gap:3px;width:86px;align-content:end}

.bcat{text-align:center;font-family:var(--font-display);font-weight:600;font-size:14px;padding:5px 4px}

.bplans{font-family:var(--font-body);font-weight:400;font-size:12px}
.bcol2{display:grid;gap:3px;width:min(260px,calc(100vw - 120px));max-height:calc(100vh - var(--barh) - 40px);overflow:auto;align-content:start}

.bcats{display:flex;gap:2px;align-items:center;border-bottom:1px solid var(--rule);padding-bottom:4px}

.bcats button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.bspace{flex:1;min-width:8px}
.buildbar button[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:-2px}
.tilepop{position:absolute;pointer-events:auto;z-index:4;background:var(--paper);border:1px solid var(--ink);padding:6px 8px;display:grid;gap:4px;font-size:12px;width:max-content;max-width:230px;box-shadow:0 3px 12px rgba(0,0,0,.35)}
.tilepop b{font-family:var(--font-display);font-size:14px}
.tilepop .opts{display:grid;gap:3px}
.tilepop button{font-size:12px;padding:2px 7px;text-align:left;display:grid;line-height:1.3}
.tilepop button small{font-family:var(--font-data);font-size:10px;color:var(--ink-2)}
@media (max-width:700px){.menubar>*{flex:none}.tilepop{position:fixed;left:8px!important;right:8px;top:auto!important;bottom:60px;transform:none!important;width:auto;max-width:none}.tilepop .opts{grid-template-columns:1fr 1fr}.side{top:auto;height:62vh;bottom:8px}}
.side-body{padding:12px 14px 20px;display:grid;gap:12px;align-content:start;min-width:0}
.sel-head{display:grid;gap:5px}
.side h2{font-family:var(--font-display);font-weight:900;font-size:21px;margin:0;line-height:1.25;text-wrap:balance}
.side h2 small{font-size:14px;font-weight:600;color:var(--ink-2)}
.side h3{font-size:12px;letter-spacing:.14em;color:var(--ink-2);margin:4px 0 0;border-bottom:1px solid var(--rule);padding-bottom:3px;display:flex;justify-content:space-between;gap:8px;font-weight:600}
.build-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.build-grid button{text-align:left;display:grid;gap:1px;padding:6px 8px}
.build-grid button[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:-2px}
button.small.on{background:var(--ink);color:var(--paper)}
.bar{height:6px;border:1px solid var(--ink);background:var(--paper)}.bar i{display:block;height:100%;background:var(--accent)}
.build-grid small{font-family:var(--font-data);font-size:11px;color:var(--ink-2)}
.build-grid .desc{font-family:var(--font-body)}
.bstate{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dotted var(--rule)}
.plist{display:grid;gap:0}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:4px 0;border-bottom:1px dotted var(--rule);font-size:13px}
.prow .who{display:flex;gap:6px;align-items:baseline;min-width:0}
.prow .who b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats{font-family:var(--font-data);font-size:11px;color:var(--ink-2);white-space:nowrap}
.stats i{font-style:normal;color:var(--ink)}
.tag{display:inline-block;font-size:11px;line-height:1.45;padding:0 5px;border:1px solid var(--ink-2);border-radius:2px;white-space:nowrap;color:var(--ink-2)}
.tag.lead{border-color:var(--accent);color:var(--accent)}
.tag.bad{border-color:var(--danger);color:var(--danger)}
.roster{width:100%;border-collapse:collapse;font-size:12px}
.roster th,.roster td{text-align:left;padding:4px 4px;border-bottom:1px dotted var(--rule);white-space:nowrap}
.roster th{font-weight:600;color:var(--ink-2);border-bottom:1px solid var(--rule);cursor:pointer}
.roster td.n{font-family:var(--font-data);text-align:center}
.roster tr.sel td{background:var(--paper-2)}
.tablewrap{overflow-x:auto;max-width:100%}
.pcard{display:grid;gap:6px}
.pcard figure{margin:0;aspect-ratio:16/9;max-width:100%;border:1px solid var(--ink);background:var(--paper-2);overflow:hidden}
.pcard figure img{width:100%;height:100%;object-fit:cover;display:block}
.pcard p{margin:0;font-size:13px;white-space:pre-wrap}
.ph{width:100%;height:100%;display:grid;place-items:center;text-align:center;font-family:var(--font-data);font-size:12px;color:var(--ink-2);background-image:repeating-linear-gradient(135deg,transparent 0 9px,var(--shade) 9px 10px);padding:8px}
.badge{display:inline-block;font-size:11px;line-height:1.5;padding:0 6px;border:1px solid currentColor;border-radius:2px;white-space:nowrap;font-family:var(--font-body)}
.s-ok{color:var(--st-ok)}.s-single{color:var(--st-single)}.s-user{color:var(--st-user)}.s-conflict{color:var(--st-conflict)}.s-pending{color:var(--st-pending)}.s-ai{color:var(--st-ai)}.s-none{color:var(--ink-2);border-style:dashed}
.field{display:grid;gap:3px;min-width:0}
.field label,.field .lbl2{font-size:12px;color:var(--ink-2)}
.form-grid{display:grid;gap:8px}
.calc{font-family:var(--font-data);font-size:12px;margin:0;color:var(--ink-2)}
.warnline{margin:0;font-size:13px;color:var(--danger)}
.chron{display:grid;margin:0;padding:0;list-style:none}
.chron li{display:grid;grid-template-columns:78px minmax(0,1fr);gap:8px;padding:5px 0;border-bottom:1px dotted var(--rule);font-size:13px}
.chron time{font-family:var(--font-data);font-size:12px;color:var(--ink-2)}
details{border-top:1px solid var(--rule);padding-top:6px}
summary{cursor:pointer;font-weight:600;letter-spacing:.06em}
.tune{display:grid;gap:8px;padding:8px 0 4px}
.tn{display:grid;grid-template-columns:minmax(0,1fr) 56px;gap:2px 8px;align-items:center}
.tn label{grid-column:1/-1;font-size:12px;color:var(--ink-2)}
.tn output{font-family:var(--font-data);font-size:12px;text-align:right}
.tn output.changed{color:var(--accent);font-weight:600}
.check{display:flex;gap:6px;align-items:center;font-size:13px;cursor:pointer}
.filebtn{display:inline-block;font-size:14px;border:1px solid var(--ink);border-radius:2px;background:var(--paper-2);padding:4px 10px;cursor:pointer;line-height:1.35;position:relative}
.filebtn:hover{background:var(--paper-3)}
.filebtn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.filebtn input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.card-list{display:grid;gap:0}
.card-list h4{margin:12px 0 2px;font-size:12px;letter-spacing:.12em;color:var(--ink-2);font-weight:600}
.cl-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;text-align:left;background:transparent;border:none;border-bottom:1px dotted var(--rule);border-radius:0;padding:5px 2px}
.cl-item:hover:not(:disabled){background:var(--paper-2)}
.cl-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cl-meta{display:flex;gap:4px;align-items:center;font-size:11px;color:var(--ink-2)}
.cl-meta i{font-style:normal;border:1px solid var(--ink-2);padding:0 3px;border-radius:2px;line-height:1.4}
.drop{border:1px dashed var(--ink);padding:8px;display:grid;gap:6px;justify-items:center;text-align:center;font-size:12px;color:var(--ink-2)}
.drop.over{background:var(--paper-3)}
.drop .prev{width:100%;aspect-ratio:16/9;max-width:100%;border:1px solid var(--rule);overflow:hidden;background:var(--paper-2)}
.drop .prev img{width:100%;height:100%;object-fit:contain;display:block}
.ovl-item{display:grid;gap:6px;border:1px solid var(--rule);padding:8px}
.helptext{display:grid;gap:8px}
.helptext p,.helptext li{font-size:13px;margin:0}
.helptext ul{padding-left:1.2em;margin:0;display:grid;gap:3px}
.legend-st{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:center;font-size:13px}

.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:var(--scrim);padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.card{width:min(580px,100%);max-height:100%;overflow:auto;background:var(--paper);border:3px double var(--ink);display:grid;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.card.wide{width:min(760px,100%)}
.card-img{aspect-ratio:16/9;max-width:100%;border-bottom:1px solid var(--ink);background:var(--paper-2);overflow:hidden}
.card-img img{width:100%;height:100%;object-fit:cover;display:block}
.card-body{padding:14px 18px 6px;display:grid;gap:8px}
.card-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-family:var(--font-data);font-size:12px;color:var(--ink-2)}
.card h2{font-family:var(--font-display);font-weight:900;font-size:24px;margin:0;line-height:1.25;text-wrap:balance}
.card-text{white-space:pre-wrap;line-height:1.8;max-width:65ch}
.card-note{margin:0;font-size:13px;border-top:1px dotted var(--rule);padding-top:6px}
.card-src{margin:0;font-size:12px;color:var(--ink-2)}
.card-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:10px 18px 16px}
.name-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:14px 0 2px}
.name-opt{font:600 18px 'Noto Serif TC',serif;letter-spacing:.06em;padding:16px 8px;line-height:1.3}
.card .stats2{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:4px 12px;font-size:13px;margin:0}
.card .stats2 div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted var(--rule)}
.title-card h2{font-family:var(--font-hand);font-weight:400;font-size:clamp(40px,8vw,64px);letter-spacing:.08em}
.title-card ul{margin:0;padding-left:1.2em;display:grid;gap:3px;font-size:13px}
.cand{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dotted var(--rule);font-size:13px;cursor:pointer}
.cand input{width:18px;height:18px}
.feed{position:fixed;left:50%;bottom:max(52px,calc(env(safe-area-inset-bottom,0px) + 52px));transform:translateX(-50%);z-index:30;display:grid;gap:3px;justify-items:center;pointer-events:none;max-width:min(560px,calc(100% - 240px))}
.feed span{background:rgba(26,31,36,.82);color:var(--paper);padding:3px 10px;font-size:12px;border-radius:2px;animation:feedin .25s ease-out;transition:opacity .6s}
.feed span.out{opacity:0}
@keyframes feedin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.hovtag{position:absolute;z-index:3;pointer-events:none;background:rgba(26,31,36,.88);color:var(--paper);padding:2px 7px;font-size:11px;white-space:nowrap;transform:translate(12px,14px);border-radius:2px}
.hovtag b{font-weight:600;margin-right:6px}
@media (max-width:700px){.feed{max-width:calc(100% - 24px)}}
.toast{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:49;background:var(--ink);color:var(--paper);padding:7px 14px;border-radius:2px;font-size:13px;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){body{transition:none}}
/* ===== 介面第二版：浮在 3D 據點上的深色面板。底色取靛染布的藍黑，重點色取藤與茅草的黃；只有這一種外觀。
   舊規則大量用 --paper 當底、--ink 當字，這裡把兩者對調；原本「反白」的頂欄再在自己的範圍裡調回來。 ===== */
:root,:root.winter{
  --paper:#151b22;--paper-2:#1e2730;--paper-3:#2c3744;--ink:#e9edf0;--ink-2:#9ba8b4;--rule:#34414e;
  --accent:#e8a33d;--accent-ink:#1b1305;--danger:#e2553f;--danger-ink:#fff;--danger-bg:#472019;--warn-bg:#3b321d;--good:#93c96f;
  --shade:rgba(255,255,255,.06);--scrim:rgba(5,8,11,.62);--halo:#0c1116;--glass:rgba(17,23,29,.86);--edge:rgba(255,255,255,.11);
  --st-ok:#8fce76;--st-single:#e0b45a;--st-user:#7fb5e6;--st-conflict:#f08876;--st-pending:#a9a59e;--st-ai:#b79be0;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:dark;
}
:root.winter{--accent:#7fbbe4;--accent-ink:#06131c}
body{background:#0c1116;transition:none}
button{border-radius:6px;border-color:var(--rule);background:var(--paper-2);padding:5px 11px}
button.small{border-radius:5px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
button.primary:hover:not(:disabled){background:var(--accent);filter:brightness(1.1)}
button.link{color:var(--accent)}
input[type=text],input[type=number],textarea,select{border-color:var(--rule);border-radius:6px;background:#0f141a}
.chip,.res,.tag,.meter,.bar,.filebtn,.drop,.pcard figure,.card-img,.exitl,.node,.ovl-item,.proj,.ttree,.tnode{border-color:var(--rule)}
.chip,.tag,.badge,.exitl,.node{border-radius:5px}
.side,.card,.tilepop,.tut,.buildbar,.morepop{background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--edge);border-radius:10px;box-shadow:0 12px 34px rgba(0,0,0,.5)}
.card-img{border-radius:9px 9px 0 0}
.topbar2{--paper:#e9edf0;--paper-3:#93a0ac;--ink:#0f141a;background:rgba(11,16,21,.9);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--edge);font-size:13px;padding-top:max(6px,env(safe-area-inset-top,0px));padding-bottom:6px;gap:6px 16px}
.topbar2 .date{font-size:14px;font-weight:600}
.topbar2 .chip{font-size:11px;border-color:rgba(255,255,255,.22)}
.topbar2 .ledger{gap:2px 16px}
.topbar2 .res .k{font-size:11px}.topbar2 .res .v{font-size:16px;font-weight:600}.topbar2 .res .d{font-size:11px}
.topbar2 .res .d.neg{color:#ff9b88}.topbar2 .res .d.pos{color:#a8dc86}
.topbar2 button{font-size:13px;padding:4px 10px;border-color:rgba(255,255,255,.2)}
.topbar2 .speed button{padding:4px 9px;font-size:12px;border-radius:0}.topbar2 .speed button:first-child{border-radius:6px 0 0 6px}.topbar2 .speed button:last-child{border-radius:0 6px 6px 0}
.topbar2 .menubar .side-tabs button{padding:4px 10px;border-color:rgba(255,255,255,.2);border-radius:0}
.topbar2 .side-tabs button:first-of-type,.topbar2 .maptabs button:first-child{border-radius:6px 0 0 6px}.topbar2 .side-tabs button:last-child,.topbar2 .maptabs button:last-child{border-radius:0 6px 6px 0}
.topbar2 #btn-build{font-weight:700}
.topbar2 .morebtn{font-size:12px;padding:2px 9px}
.morepop .res{background:var(--paper-2);border-radius:6px;padding:2px 9px 3px}
.tut{font-size:13px;box-shadow:0 12px 34px rgba(0,0,0,.5);overflow:hidden}
.tut header{background:transparent;color:var(--ink);border-bottom:1px solid var(--rule);padding:6px 10px}
.tut header button{color:var(--ink-2);border-color:var(--rule);padding:1px 8px}
.tut ol{padding:8px 10px 10px 30px;gap:4px}
.tut li.now{color:var(--accent)}.tut li.now .tip{color:var(--ink)}
.buildbar{padding:8px;gap:6px}
.buildbar button{font-size:14px;padding:5px 10px}
.buildbar button small{font-size:11px}
.buildbar button small.yl{color:var(--ink-2)}
.bcol1{width:96px;gap:4px}.bcat{font-family:var(--font-body);font-weight:700;padding:7px 4px}
.bcat[aria-expanded="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.bcol2{gap:4px;width:min(280px,calc(100vw - 130px))}
.tilepop{font-size:13px;padding:10px 12px;max-width:260px}
.side h2{font-family:var(--font-body);font-weight:700}
.side h3{letter-spacing:.08em}
.card{border:1px solid var(--edge)}
.card h2{font-family:var(--font-body);font-weight:700}
.title-card h2{font-family:var(--font-hand);font-weight:400}
.tnode{border-radius:6px}
.tnode b{font-family:var(--font-body);font-weight:700}
.tnode.ready{background:var(--paper-2)}
.tnode.done{background:color-mix(in srgb,var(--accent) 22%,var(--paper));color:var(--ink);border-color:var(--accent)}
.tnode.done span,.tnode.done small{color:var(--ink-2)}
.tbr{font-family:var(--font-body);border-right-color:var(--rule)}
.toast{background:var(--glass);color:var(--ink);border:1px solid var(--edge);border-radius:8px;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.feed span{border-radius:6px;font-size:13px;padding:4px 12px}
.lbl{font-family:var(--font-body);font-style:normal;font-weight:500;text-shadow:0 1px 3px rgba(0,0,0,.9),0 0 6px rgba(0,0,0,.6)}
.lbl.sm{font-style:normal;color:rgba(233,237,240,.8)}
.exitl{background:var(--glass);color:var(--ink);padding:2px 8px;font-size:12px}
.zoombar{right:max(10px,env(safe-area-inset-right,0px));bottom:max(10px,env(safe-area-inset-bottom,0px))}
.zoombar .rotmode{font-size:14px}.zoombar .rotmode[aria-pressed="true"]{background:var(--c-mat);color:#1a1f24;border-color:var(--c-mat)}
.zoombar button{background:var(--glass);border-color:var(--edge);width:36px;height:36px;padding:0;display:grid;place-items:center;opacity:1}
.drawer-x{border-radius:6px}
/* ===== 介面第三版：頂欄兩列（精神指標在前）、底部建造列、右側提醒、目標卡 ===== */
:root{--barh:84px;--c-surv:#8fbf6a;--c-mat:#e8a33d;--c-guard:#e0705c;--c-craft:#b08ae0}
.topbar2{flex-wrap:wrap;gap:5px 12px;padding-bottom:6px}
.topbar2 .ledger{order:3;flex-basis:100%;overflow-x:auto;gap:6px;align-items:stretch;scrollbar-width:none}
.topbar2 .ledger::-webkit-scrollbar{display:none}
.topbar2 .tb-right{margin-left:auto}
.ic{display:grid;place-items:center;width:24px;height:24px;border-radius:6px;font-style:normal;font-size:13px;font-weight:700;background:rgba(255,255,255,.1);grid-row:1/3}
.topbar2 .res.pill{display:grid;grid-template-columns:auto auto;grid-template-rows:auto auto;column-gap:7px;align-items:center;padding:3px 11px 3px 5px;background:rgba(255,255,255,.05);border:1px solid var(--edge);border-radius:9px}
.topbar2 .res.pill .k{font-size:10px;line-height:1.2;color:var(--paper-3)}
.topbar2 .res.pill .vv{display:flex;align-items:baseline;gap:5px;line-height:1.15}
.topbar2 .lead{display:flex;align-items:center;gap:4px 16px;padding:3px 14px 3px 5px;border:1px solid rgba(232,163,61,.55);border-radius:9px;background:rgba(232,163,61,.1);font:inherit;flex:none;text-align:left}
.topbar2 .lead:hover{background:rgba(232,163,61,.18)}
.lead .lg{display:grid;grid-template-columns:auto auto;grid-template-rows:auto auto;column-gap:7px;align-items:center}
.lead .lg .k{font-size:10px;line-height:1.2;color:var(--paper-3)}
.lead .lg .v{font-size:17px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.lead .lg .v small{font-size:11px;font-weight:400;margin-left:2px;color:var(--paper-3)}
.lead .lg .v .d{font-size:11px;font-weight:400;margin-left:5px;color:var(--paper-3)}
.lead .ic{background:var(--accent);color:#1b1408}
.lead .lg.hours{grid-template-columns:auto auto 96px}
.lead .lg.hours.good .v{color:#a8dc86}.lead .lg.hours.bad .v{color:#ff9b88}
.lead .lk{font-size:15px;color:var(--accent);margin:0 -8px}
.lead .apex .v{font-size:13px;letter-spacing:2px;color:var(--accent)}

<script>
// 航海開場：WebGPU 全畫面光線步進。海面＝多組深水波疊加（色散 ω=√(gk)），
// 海岸照實景照片的樣子：陡峭林坡直落海裡、層層山腳越遠越藍、黑礫石灘、天上成片高積雲。攝影機架在船上，跟著波浪起伏（船身取四點的浪高算俯仰與側傾）。
// SeaIntro.run(host, opts) → Promise<'done'|'skipped'|'unsupported'>
const SeaIntro = (() => {
  const WGSL = /* wgsl */ `
struct U {
  res: vec2f, time: f32, fade: f32,
  camPos: vec3f, focal: f32,
  camR: vec3f, coastX: f32,
  camU: vec3f, exposure: f32,
  camF: vec3f, gamma: f32,
  sun: vec3f, quality: f32,
};
@group(0) @binding(0) var<uniform> u: U;

@vertex fn vs(@builtin(vertex_index) i: u32) -> @builtin(position) vec4f {
  var p = array<vec2f, 3>(vec2f(-1.0, -1.0), vec2f(3.0, -1.0), vec2f(-1.0, 3.0));
  return vec4f(p[i], 0.0, 1.0);
}

// ---------- 雜訊
fn hash2(p: vec2f) -> f32 {
  var q = fract(p * vec2f(0.1031, 0.1030));
  q += dot(q, q.yx + 33.33);
  return fract((q.x + q.y) * q.x);
}
fn vnoise(p: vec2f) -> f32 {
  let i = floor(p); let f = fract(p);
  let w = f * f * (3.0 - 2.0 * f);
  let a = hash2(i); let b = hash2(i + vec2f(1.0, 0.0));
  let c = hash2(i + vec2f(0.0, 1.0)); let d = hash2(i + vec2f(1.0, 1.0));
  return mix(mix(a, b, w.x), mix(c, d, w.x), w.y);
}
const ROT = mat2x2f(0.80, 0.60, -0.60, 0.80);
fn fbm(p0: vec2f, oct: i32) -> f32 {
  var p = p0; var a = 0.5; var s = 0.0;
  for (var i = 0; i < oct; i++) { s += a * vnoise(p); p = ROT * p * 2.03; a *= 0.5; }
  return s;
}
fn ridged(p0: vec2f, oct: i32) -> f32 {
  var p = p0; var a = 0.6; var s = 0.0;
  for (var i = 0; i < oct; i++) {
    let n0 = vnoise(p);
    let n = select(n0, 1.0 - abs(n0 * 2.0 - 1.0), i == 0);   // 只有最大一層是山脊，其餘是圓的起伏
    s += a * n; p = ROT * p * 2.07; a *= 0.42;
  }
  return s;
}

// ---------- 海浪：每一組是一道深水波，波峰尖、波谷平；後一組的取樣點被前一組的斜率拖動（波與波互相牽動）
const WIND = 0.55;
fn waves(p: vec2f, t: f32, n: i32, lod: f32) -> f32 {
  var h = 0.0; var amp = 0.78; var k = 0.075;
  var q = p;
  for (var i = 0; i < n; i++) {
    let fi = f32(i);
    let ang = WIND + sin(fi * 12.9898 + 4.1) * (0.35 + 0.06 * fi);
    let d = vec2f(cos(ang), sin(ang));
    let w = sqrt(9.81 * k);
    let ph = dot(d, q) * k - t * w + fi * 2.13;
    let sharp = 1.7 + 0.12 * fi;
    let s = exp(sharp * (sin(ph) - 1.0));
    let ds = sharp * cos(ph) * s;
    let grp = 0.62 + 0.38 * sin(dot(vec2f(-d.y, d.x), q) * k * 0.23 + dot(d, q) * k * 0.11 + fi * 1.7);
    let fade = clamp(lod - fi, 0.0, 1.0);
    h += amp * s * grp * fade;
    q += d * (-ds) * amp * grp * 0.32 * fade;
    amp *= 0.55; k *= select(1.43, 1.74, (i & 1) == 0);
  }
  return h - 0.42;
}
fn seaLod(t: f32, base: f32) -> f32 { return clamp(base - log2(t * 0.02 + 1.0) * 1.15, 1.5, base); }

// ---------- 海岸（照使用者的實景照片）：岸在右手邊（x 往岸），沿岸一道道陡峭林坡直落海裡，
// 每隔一段一道山腳伸出來，越遠越藍；前方一處海灣：岸線只退一點、山腳退很多，中間是低平林地，後面一座尖峰。
fn spur(z: f32) -> f32 {
  let ph = z / 1700.0 + 0.35 * sin(z * 0.00041);
  return pow(0.5 + 0.5 * cos(6.28318 * ph), 5.0);
}
fn bayK(z: f32) -> f32 { return smoothstep(3800.0, 5200.0, z) * (1.0 - smoothstep(7200.0, 8600.0, z)); }
fn footX(z: f32) -> f32 { return u.coastX + 110.0 * sin(z * 0.0011 + 1.3) - 280.0 * spur(z) + 1700.0 * bayK(z); }
fn shoreX(z: f32) -> f32 { return footX(z) - 1450.0 * bayK(z) + 15.0 * sin(z * 0.013); }
fn terrainH(p: vec2f, oct: i32) -> f32 {
  let ds = p.x - shoreX(p.y);
  if (ds < 0.0) { return max(ds * mix(0.12, 0.03, bayK(p.y)), -90.0); }
  let dm = p.x - footX(p.y);
  let q = p * 0.0007;
  let crest = 700.0 + 450.0 * fbm(vec2f(p.y * 0.00035, 3.7), 3);
  let tip = 170.0 + 160.0 * fbm(vec2f(p.y * 0.0011, 9.1), 2) + 120.0 * spur(p.y);
  var h = 0.0;
  if (dm > 0.0) {
    let ridge = min(tip + dm * 0.33, crest + dm * 0.05);
    let cliff = ridge * (1.0 - exp(-dm / 110.0));
    let inner = smoothstep(1500.0, 6000.0, dm) * (350.0 + 900.0 * fbm(q * 0.6 + vec2f(5.1, 1.3), oct));
    let gully = 1.0 - 0.3 * pow(abs(sin(p.y * 0.0042 + fbm(q * 3.0, 2) * 3.0)), 6.0) * smoothstep(0.0, 400.0, dm);
    h = (cliff + inner) * gully;
  }
  let pk = vec2f(footX(6300.0) + 1300.0, 6300.0);
  h = max(h, 800.0 * exp(-pow(length(p - pk) / 950.0, 1.3)));
  let plain = 4.0 + 12.0 * smoothstep(40.0, 400.0, ds) + 8.0 * vnoise(p * 0.02);
  h = max(h, plain * bayK(p.y));
  h += (14.0 * (fbm(p * 0.012, max(oct - 1, 1)) - 0.4) + 45.0 * (fbm(p * 0.0035 + vec2f(1.7, 4.2), max(oct - 1, 1)) - 0.45)) * smoothstep(20.0, 90.0, ds);
  // 面海坡上的山溝：沿 z 方向一條條往下切
  let gq = p.y * 0.012 + fbm(p * 0.004, 2) * 4.0;
  h -= 35.0 * pow(abs(sin(gq)), 10.0) * smoothstep(30.0, 150.0, dm) * (1.0 - smoothstep(500.0, 1200.0, dm));
  let beachW = 22.0 + 80.0 * bayK(p.y);
  return mix(0.8 + ds * 0.03, h, smoothstep(beachW * 0.6, beachW * 1.4, ds));
}

// ---------- 天空：藍天、成片的高積雲、海平線上一條低雲帶
fn hash22(p: vec2f) -> vec2f { return vec2f(hash2(p), hash2(p + vec2f(19.19, 7.31))); }
fn worley(p: vec2f) -> f32 {
  let i = floor(p); let f = fract(p); var md = 4.0;
  for (var y = -1; y <= 1; y++) { for (var x = -1; x <= 1; x++) {
    let g = vec2f(f32(x), f32(y)); let r = g + hash22(i + g) * 0.9 - f; md = min(md, dot(r, r));
  } }
  return sqrt(md);
}
fn skyBase(rd: vec3f) -> vec3f {
  let y = max(rd.y, 0.0);
  let zen = vec3f(0.07, 0.24, 0.70);
  let hor = vec3f(0.55, 0.67, 0.84);
  var c = mix(hor, zen, pow(y, 0.5));
  let sd = max(dot(rd, u.sun), 0.0);
  c += vec3f(1.0, 0.92, 0.78) * (pow(sd, 8.0) * 0.18 + pow(sd, 80.0) * 0.5);
  // 海平線上的低雲帶（灰紫）
  let az = atan2(rd.x, rd.z);
  let bandH = 0.018 + 0.010 * vnoise(vec2f(az * 9.0, 1.0)) + 0.006 * vnoise(vec2f(az * 31.0, 4.0));
  c = mix(c, vec3f(0.56, 0.60, 0.70), (1.0 - smoothstep(bandH * 0.6, bandH, y)) * 0.75);
  if (rd.y < 0.0) { c = vec3f(0.56, 0.62, 0.72); }
  return c;
}
fn cloudD(ro: vec3f, rd: vec3f) -> vec2f {   // (濃度, 距離)
  if (rd.y < 0.02) { return vec2f(0.0, 1e9); }
  let t = (2800.0 - ro.y) / rd.y;
  let w = ro.xz + rd.xz * t + vec2f(u.time * 4.0, u.time * 1.5);
  let mask = smoothstep(0.18, 0.52, fbm(w * 0.00012 + vec2f(2.0, 7.0), 4));
  let cell = 1.0 - worley(w * 0.0011);
  let fine = 1.0 - worley(w * 0.0034 + 3.1);
  let d = (cell * 0.7 + fine * 0.3 + fbm(w * 0.003, 4) * 0.4) * mask;
  return vec2f(smoothstep(0.42, 0.85, d), t);
}
fn sky(ro: vec3f, rd: vec3f) -> vec3f {
  var c = skyBase(rd);
  let cd = cloudD(ro, rd);
  if (cd.x > 0.0) {
    let lit = smoothstep(0.2, 0.9, cd.x);
    let ccol = mix(vec3f(0.56, 0.63, 0.78), vec3f(1.08, 1.07, 1.05), lit) + vec3f(0.25, 0.22, 0.16) * pow(max(dot(rd, u.sun), 0.0), 6.0);
    let far = 1.0 - smoothstep(9000.0, 40000.0, cd.y);
    c = mix(c, ccol, smoothstep(0.0, 0.5, cd.x) * mix(0.3, 0.97, far));
  }
  return c;
}
fn haze(rd: vec3f) -> vec3f {
  let sd = max(dot(rd, u.sun), 0.0);
  return vec3f(0.56, 0.64, 0.76) + vec3f(0.30, 0.26, 0.18) * pow(sd, 8.0);
}

// ---------- 光線求交
fn traceSea(ro: vec3f, rd: vec3f) -> f32 {
  if (rd.y > -0.00005) { return -1.0; }
  var tn = max((1.45 - ro.y) / rd.y, 0.0);
  let tf = min((-0.6 - ro.y) / rd.y, 30000.0);
  if (tn > tf) { return -1.0; }
  var t = tn;
  var hPrev = 1.0; var tPrev = tn;
  let steps = i32(24.0 + 40.0 * u.quality);
  for (var i = 0; i < steps; i++) {
    let p = ro + rd * t;
    let hh = p.y - waves(p.xz, u.time, 7, seaLod(t, 7.0));
    if (hh < 0.0) {
      var a = tPrev; var b = t; var ha = hPrev; var hb = hh;
      for (var j = 0; j < 6; j++) {
        let m = mix(a, b, ha / (ha - hb));
        let pm = ro + rd * m;
        let hm = pm.y - waves(pm.xz, u.time, 7, seaLod(m, 7.0));
        if (hm < 0.0) { b = m; hb = hm; } else { a = m; ha = hm; }
      }
      return mix(a, b, ha / (ha - hb));
    }
    tPrev = t; hPrev = hh;
    t += max(hh / max(-rd.y, 0.02) * 0.35, 0.05 + t * 0.012);
    if (t > tf) { break; }
  }
  return tf;
}
fn traceLand(ro: vec3f, rd: vec3f) -> f32 {
  if (rd.x < 0.003 || rd.y > 0.5) { return -1.0; }
  var t = max((u.coastX - 450.0 - ro.x) / rd.x, 0.0);
  var tp = t;
  let steps = i32(90.0 + 90.0 * u.quality);
  for (var i = 0; i < steps; i++) {
    let p = ro + rd * t;
    if (p.y > 2600.0 || t > 60000.0) { return -1.0; }
    let d = p.y - terrainH(p.xz, 4);
    if (d < 0.0008 * t) {
      var a = tp; var b = t;
      for (var j = 0; j < 6; j++) { let m = 0.5 * (a + b); let pm = ro + rd * m; if (pm.y - terrainH(pm.xz, 4) < 0.0008 * m) { b = m; } else { a = m; } }
      return b;
    }
    tp = t;
    t += max(d * 0.4, 1.5 + t * 0.004);
  }
  return -1.0;
}
fn landNormal(p: vec2f, t: f32) -> vec3f {
  let e = max(1.5, t * 0.002);
  let h = terrainH(p, 6);
  return normalize(vec3f(h - terrainH(p + vec2f(e, 0.0), 6), e, h - terrainH(p + vec2f(0.0, e), 6)));
}
fn seaNormal(p: vec2f, t: f32) -> vec3f {
  let e = max(0.02, t * 0.0011);
  let lod = seaLod(t, 12.0);
  let h = waves(p, u.time, 13, lod);
  var n = vec3f(h - waves(p + vec2f(e, 0.0), u.time, 13, lod), e, h - waves(p + vec2f(0.0, e), u.time, 13, lod)) / e;
  let ne = 0.12;
  let wd = vec2f(cos(WIND), sin(WIND));
  let q1 = p * 1.3 - wd * u.time * 1.1; let q2 = p * 3.1 + vec2f(-wd.y, wd.x) * u.time * 0.7;
  let a1 = vnoise(q1); let a2 = vnoise(q2);
  let g = vec2f(vnoise(q1 + vec2f(ne, 0.0)) - a1, vnoise(q1 + vec2f(0.0, ne)) - a1) / ne * 0.045 + vec2f(vnoise(q2 + vec2f(ne, 0.0)) - a2, vnoise(q2 + vec2f(0.0, ne)) - a2) / ne * 0.022;
  let q3 = p * 9.0 - wd * u.time * 2.2; let a3 = vnoise(q3);
  let g3 = vec2f(vnoise(q3 + vec2f(ne, 0.0)) - a3, vnoise(q3 + vec2f(0.0, ne)) - a3) / ne * 0.02 * (1.0 - smoothstep(5.0, 60.0, t));
  let near = 1.0 - smoothstep(40.0, 700.0, t);
  n = vec3f(n.x - g3.x, n.y, n.z - g3.y);
  n = vec3f(n.x - g.x * near, 1.0, n.z - g.y * near);
  return normalize(n);
}

fn aces(x: vec3f) -> vec3f {
  return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), vec3f(0.0), vec3f(1.0));
}
fn landAerial(rd: vec3f, t: f32) -> vec3f {   // 遠山一層比一層藍，最後融進天邊
  return mix(vec3f(0.26, 0.36, 0.52), haze(rd), smoothstep(4000.0, 22000.0, t));
}

@fragment fn fs(@builtin(position) fc: vec4f) -> @location(0) vec4f {
  let uv = vec2f(fc.x - 0.5 * u.res.x, 0.5 * u.res.y - fc.y) / u.res.y;
  let ro = u.camPos;
  let rd = normalize(u.camF * u.focal + u.camR * uv.x + u.camU * uv.y);
  let sunCol = vec3f(1.0, 0.95, 0.86) * 2.4;
  let skyAmb = vec3f(0.34, 0.46, 0.66);

  let tl = traceLand(ro, rd);
  let ts = traceSea(ro, rd);
  var col: vec3f;
  if (tl > 0.0 && (ts < 0.0 || tl < ts)) {
    // ---- 陸地：深綠的闊葉林坡、陡處露一點灰岩、坡腳一條黑礫石灘
    let p = ro + rd * tl;
    var n = landNormal(p.xz, tl);
    let ds = p.x - shoreX(p.z);
    let tw = abs(n.x) / (abs(n.x) + abs(n.z) + 1e-3);
    let cq = mix(p.xz, vec2f(p.z, p.y), tw) * mix(0.11, 0.09, tw) + vec2f(0.0, p.y * 0.05 * (1.0 - tw));
    let c0 = vnoise(cq);
    let cg = vec2f(vnoise(cq + vec2f(0.2, 0.0)) - c0, vnoise(cq + vec2f(0.0, 0.2)) - c0) / 0.2;
    let cn = (1.0 - smoothstep(1200.0, 5000.0, tl)) * smoothstep(5.0, 25.0, p.y);
    n = normalize(n + vec3f(-cg.x * (1.0 - tw), cg.y * tw, -cg.y * (1.0 - tw) - cg.x * tw) * 0.5 * cn);
    let wq = mix(p.xz, vec2f(p.z, p.y), tw);
    let v = vnoise(wq * 0.010) * 0.45 + vnoise(wq * 0.045) * 0.3 + c0 * 0.25;
    var alb = mix(vec3f(0.016, 0.034, 0.018), vec3f(0.050, 0.090, 0.038), v) * (0.65 + 0.7 * c0);
    let steep = smoothstep(0.30, 0.12, n.y) * smoothstep(0.55, 0.8, vnoise(p.xz * vec2f(0.02, 0.006)));
    alb = mix(alb, vec3f(0.10, 0.11, 0.10), steep * 0.6);
    let beach = (1.0 - smoothstep(2.0, 4.5, p.y)) * (1.0 - smoothstep(15.0, 60.0 + 80.0 * bayK(p.z), ds));
    let peb = vnoise(p.xz * 3.0);
    alb = mix(alb, mix(vec3f(0.05, 0.05, 0.055), vec3f(0.16, 0.16, 0.16), smoothstep(0.6, 0.95, peb)), beach);
    let dif = max(dot(n, u.sun), 0.0);
    let amb = (skyAmb * (0.55 + 0.45 * n.y) + vec3f(0.05, 0.08, 0.03)) * 1.25;
    col = alb * (sunCol * 0.75 * dif + amb);
    let fa = 1.0 - exp(-max(tl - 400.0, 0.0) * 0.00019);
    col = mix(col, landAerial(rd, tl), fa);
    // 稜線之間的薄霧（離海面越近越濃）
    col = mix(col, haze(rd), exp(-max(p.y, 0.0) / 260.0) * 0.18 * smoothstep(1500.0, 6000.0, tl));
  } else if (ts > 0.0) {
    // ---- 海
    let p = ro + rd * ts;
    let n = seaNormal(p.xz, ts);
    let v = -rd;
    let hh = waves(p.xz, u.time, 7, seaLod(ts, 7.0));
    let ndv = clamp(dot(n, v), 0.0, 1.0);
    let F = 0.02 + 0.6 * pow(1.0 - ndv, 5.0);   // 粗糙水面：掠角的反射打折，不會整片發白
    var rr = reflect(rd, n); rr.y = abs(rr.y);
    var refl = skyBase(rr) * 0.92;
    let cd = cloudD(p, rr);
    refl = mix(refl, vec3f(0.85, 0.88, 0.95), smoothstep(0.0, 0.6, cd.x) * 0.3);
    // 往岸邊看的反射：倒映暗綠的山
    let toCoast = smoothstep(0.02, 0.25, rr.x) * (1.0 - smoothstep(0.0, 0.16, rr.y)) * (1.0 - smoothstep(1500.0, 9000.0, ts));
    refl = mix(refl, vec3f(0.07, 0.11, 0.12), toCoast * 0.7);
    let hv = normalize(u.sun + v);
    let ndh = max(dot(n, hv), 0.0);
    let a = 0.09 + ts * 0.00003;
    let a2 = a * a;
    let dd = ndh * ndh * (a2 - 1.0) + 1.0;
    let D = a2 / (3.14159 * dd * dd);
    let spec = D * F * max(dot(n, u.sun), 0.0) * 0.25 * sunCol;
    let toSun = max(dot(normalize(vec3f(rd.x, 0.0, rd.z)), normalize(vec3f(u.sun.x, 0.0, u.sun.z))), 0.0);
    let crest = clamp((hh + 0.42) / 1.4, 0.0, 1.0);
    var body = vec3f(0.003, 0.012, 0.042) * (skyAmb * 1.6 + sunCol * 0.15) * (0.6 + 0.6 * crest);
    body += vec3f(0.006, 0.050, 0.085) * crest * 1.2 * (0.35 + 0.65 * max(dot(n, u.sun), 0.0));
    body += vec3f(0.02, 0.14, 0.16) * pow(toSun, 3.0) * clamp(hh, 0.0, 1.0) * 0.3;
    let depth = max(-terrainH(p.xz, 3), 0.0);
    let shallow = exp(-depth / 3.0);
    body = mix(body, vec3f(0.035, 0.07, 0.09) * (sunCol * 0.35 + skyAmb), shallow * 0.7);
    col = mix(body, refl, F) + spec;
    // 白浪：浪峰零星白頭、岸邊碎浪

    var foam = smoothstep(0.75, 1.15, hh + 0.42) * smoothstep(0.35, 0.8, fn1) * smoothstep(0.55, 0.75, vnoise(p.xz * 0.02 + 3.0));
    let s = p.x - shoreX(p.z);
    let surf = smoothstep(0.55, 1.0, sin(-s * 0.13 + u.time * 1.15 + vnoise(p.xz * 0.03) * 6.0)) * exp(-depth / 1.6) * step(-120.0, s);
    let lace = smoothstep(0.45, 0.75, vnoise(p.xz * 0.9 + u.time * 0.2)) * exp(-max(-s, 0.0) / 25.0);
    foam = clamp(foam * (1.0 - smoothstep(600.0, 3000.0, ts)) + (surf * (0.6 + 0.4 * fn1) + lace * 0.6) * (1.0 - smoothstep(1500.0, 6000.0, ts)), 0.0, 1.0);
    col = mix(col, vec3f(0.85, 0.88, 0.92) * (sunCol * 0.45 + skyAmb), foam * 0.85);

  } else {
    var c = sky(ro, rd);
    let sd = dot(rd, u.sun);
    c += vec3f(1.0, 0.92, 0.75) * smoothstep(0.99975, 0.99990, sd) * 40.0;

  var o = aces(col * u.exposure);
  let q = fc.xy / u.res;
  o *= 0.84 + 0.16 * pow(16.0 * q.x * q.y * (1.0 - q.x) * (1.0 - q.y), 0.22);
  o = pow(o, vec3f(u.gamma));
  o += (hash2(fc.xy + fract(u.time) * 91.0) - 0.5) / 160.0;
  return vec4f(o * u.fade, 1.0);
}
`;

  // JS 版的浪高（和 WGSL 的 waves 同一個公式），拿來讓船隨浪起伏
  function waves(x, z, t, n) {
    let h = 0, amp = 0.78, k = 0.075, qx = x, qz = z;
    for (let i = 0; i < n; i++) {
      const ang = 0.55 + Math.sin(i * 12.9898 + 4.1) * (0.35 + 0.06 * i);
      const dx = Math.cos(ang), dz = Math.sin(ang), w = Math.sqrt(9.81 * k);
      const dq = dx * qx + dz * qz;
      const ph = dq * k - t * w + i * 2.13, sharp = 1.7 + 0.12 * i;
      const s = Math.exp(sharp * (Math.sin(ph) - 1)), ds = sharp * Math.cos(ph) * s;
      const grp = 0.62 + 0.38 * Math.sin((-dz * qx + dx * qz) * k * 0.23 + dq * k * 0.11 + i * 1.7);
      h += amp * s * grp; qx += dx * -ds * amp * grp * 0.32; qz += dz * -ds * amp * grp * 0.32;
      amp *= 0.55; k *= i % 2 === 0 ? 1.74 : 1.43;
    }

function rnd(st) {
  st.rng = (st.rng + 0x6D2B79F5) | 0;
  let t = st.rng;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}

  st.counter[a.k] = (st.counter[a.k] || 0) + 1;
  const p = makePerson(st, a.origin, { headman: a.lead, label: `${a.name} ${String(st.counter[a.k]).padStart(2, '0')}` });
  for (const [k, v] of Object.entries(a.bias || {})) p.s[k] = Math.min(10, p.s[k] + v);
  p.arch = a.name; p.line = a.lines[Math.floor(rnd(st) * a.lines.length)];

  return p;
}

  const tot = ARCH.reduce((x, a) => x + a.w, 0);

  return ARCH[0];
}

  // 一鍵派遣：只派閒置的人，先留夠施工的人手（山高的），其餘依「這份工作看的屬性」由高到低配到空崗位；

  autoAssign(st, R, { jobs } = {}) {
